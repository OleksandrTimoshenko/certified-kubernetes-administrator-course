server {
    listen 80;

    server_name argocd.k8s.com;
    return 301 https://argocd.k8s.com$request_uri;
}

server {
    listen 443 ssl;
    server_name argocd.k8s.com;
    ssl_certificate /vagrant/argocd.k8s.com.crt;
    ssl_certificate_key /vagrant/argocd.k8s.com.key;


    location / {
        proxy_pass https://<IP>;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}