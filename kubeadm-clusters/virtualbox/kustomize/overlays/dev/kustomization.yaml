apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namePrefix: dev-
namespace: dev-namespace

patches:
- path: pv-hostpath-patch.yaml

configMapGenerator:
  - name: postgres-config
    literals:
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban
      - POSTGRES_PASSWORD=kanban
generatorOptions:
  labels:
    group: db
