apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namePrefix: prod-
namespace: prod-namespace

patches:
- path: pv-hostpath-patch.yaml
- path: pv-patch.yaml
- path: pvc-patch.yaml
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: ingress-service
  path: ingress-patch.yaml
